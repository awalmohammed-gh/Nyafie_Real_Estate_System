<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5a1d7e" />
  <meta name="robots" content="noindex" />
  <title>You're offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f6fa; color: #21192d; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 380px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
    p { margin: 0; color: #6b6275; line-height: 1.6; }
    button { margin-top: 24px; min-height: 46px; padding: 0 22px; border: 0; border-radius: 12px; background: #5a1d7e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #c9a7e3; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Homes, prices and messages need an internet connection. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
